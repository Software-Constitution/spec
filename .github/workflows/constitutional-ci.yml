name: Constitutional CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic schema validator
        run: python -m pip install -r requirements-verification.txt
      - name: Syntax and negative tests
        run: |
          node --check scct/scct.mjs
          node --check kit/lib/gate-runner.mjs
          node --test tests/*.test.mjs
      - name: Self conformance (no unverified L3/L4 claim)
        shell: bash
        run: |
          set -euo pipefail
          # Shell redirection MUST NOT create an untracked file inside the
          # candidate checkout before SCCT samples the immutable source.
          out="$(mktemp "${RUNNER_TEMP}/scct-verdict.XXXXXX")"
          set +e
          node scct/scct.mjs . --require-level=L2 > "$out"
          outcome=$?
          set -e
          cp "$out" scct-verdict.json
          cat scct-verdict.json
          exit "$outcome"
      - name: Emit exact-source T0 CI receipt (held on any earlier failure)
        if: always()
        env:
          SCCT_PREVIOUS_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/evidence-receipt.mjs
      - name: Export immutable per-run source-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constitutional-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scct-verdict.json
            ci-evidence.json
          retention-days: 90
          if-no-files-found: error
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Lake manifest
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/lake update
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
